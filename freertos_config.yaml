# freertos_config.yaml - Configuration for FreeRTOSConfig.h generation
#
# Based on:
#   https://www.freertos.org/a00110.html
#   https://www.freertos.org/FreeRTOS-Configuration-Options.html
#
# Run: python3 generate_freertos_config.py to regenerate the C header.

freertos_config:
  # Core kernel definitions
  configCPU_CLOCK_HZ: 160000000
  configTICK_RATE_HZ: 1000
  configMAX_PRIORITIES: 5
  configMINIMAL_STACK_SIZE: 128
  configTOTAL_HEAP_SIZE: 8192
  configMAX_TASK_NAME_LEN: 16
  configUSE_16_BIT_TICKS: 0
  configUSE_PREEMPTION: 1
  configUSE_TASK_PREEMPTION_DISABLE: 0
  configUSE_TIME_SLICING: 1
  configUSE_TICKLESS_IDLE: 0

  # Memory management
  configSUPPORT_STATIC_ALLOCATION: 0
  configSUPPORT_DYNAMIC_ALLOCATION: 1

  # Hooks
  configUSE_IDLE_HOOK: 0
  configUSE_TICK_HOOK: 0
  configUSE_DAEMON_TASK_STARTUP_HOOK: 0

  # Kernel behavior
  configENABLE_BACKWARD_COMPATIBILITY: 0
  configCHECK_FOR_STACK_OVERFLOW: 2
  configUSE_MALLOC_FAILED_HOOK: 1
  configUSE_NEWLIB_REENTRANT: 0

  # Synchronization
  configUSE_MUTEXES: 1
  configUSE_RECURSIVE_MUTEXES: 1
  configUSE_COUNTING_SEMAPHORES: 1
  configQUEUE_REGISTRY_SIZE: 10

  # Timers
  configUSE_TIMERS: 1
  configTIMER_TASK_PRIORITY: 2
  configTIMER_QUEUE_LENGTH: 10
  configTIMER_TASK_STACK_DEPTH: 256

  # Task & scheduler
  configUSE_APPLICATION_TASK_TAG: 0
  configUSE_TASK_NOTIFICATIONS: 1
  configUSE_PORT_OPTIMISED_TASK_SELECTION: 1

  # Trace/debugging
  configUSE_TRACE_FACILITY: 1
  configUSE_STATS_FORMATTING_FUNCTIONS: 1
  configRECORD_STACK_HIGH_ADDRESS: 1
  configGENERATE_RUN_TIME_STATS: 0
  configOPTIMIZE_FOR_RUNTIME_STATS: 0
  configTRACE_INCLUDE_USER_EVENTS: 0

  # Cortex-M33 port-specific
  configENABLE_FPU: 1
  configENABLE_MPU: 0
  configENABLE_TRUSTZONE: 0
  configUSE_TASK_FPU_SUPPORT: 2

  # Interrupt priority (STM32U5: 8 priority bits, 0=highest, 255=lowest)
  configPRIO_BITS: 8
  configKERNEL_INTERRUPT_PRIORITY: 255
  configMAX_SYSCALL_INTERRUPT_PRIORITY: 128
  configLIBRARY_LOWEST_INTERRUPT_PRIORITY: 255
  configLIBRARY_MAX_SYSCALL_INTERRUPT_PRIORITY: 128

  # API inclusions
  INCLUDE_vTaskDelayUntil: 1
  INCLUDE_vTaskDelay: 1
  INCLUDE_uxTaskPriorityGet: 1
  INCLUDE_vTaskPrioritySet: 1
  INCLUDE_vTaskDelete: 1
  INCLUDE_vTaskSuspend: 1
  INCLUDE_xTaskGetSchedulerState: 1
  INCLUDE_xTaskGetIdleTaskHandle: 0
  INCLUDE_pcTaskGetTaskName: 1
  INCLUDE_eTaskGetState: 1
  INCLUDE_xTimerPendFunctionCall: 1
  INCLUDE_xTaskAbortDelay: 1
  INCLUDE_xTaskGetHandle: 1
  INCLUDE_xTaskGetCurrentTaskHandle: 1
  INCLUDE_uxTaskGetStackHighWaterMark: 1
  INCLUDE_uxTaskGetStackHighWaterMark2: 1
  INCLUDE_pxTaskGetStackStart: 1
  INCLUDE_vTaskGetInfo: 1

  # Assertion macro
  configASSERT: "( ( x ) ? ( void ) 0 : vAssertCalled( __FILE__, __LINE__ ) )"
